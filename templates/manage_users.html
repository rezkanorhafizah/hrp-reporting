{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-primary"><i class="fas fa-users-cog me-2"></i>Manajemen User & Staf</h3>
        <a href="{% url 'add_user' %}" class="btn btn-success">
            <i class="fas fa-plus me-2"></i>Tambah User Baru
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4">Username</th>
                        <th>Status</th>
                        <th>Tanggal Gabung</th>
                        <th class="text-end pe-4">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    {% for u in users %}
                    <tr>
                        <td class="ps-4 fw-bold">{{ u.username }}</td>
                        <td><span class="badge bg-info text-dark">Staf Karyawan</span></td>
                        <td>{{ u.date_joined|date:"d M Y" }}</td>
                        <td class="text-end pe-4">
                            <a href="{% url 'delete_user' u.id %}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Yakin mau hapus user ini?');">
                                <i class="fas fa-trash-alt"></i> Hapus
                            </a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="text-center py-4 text-muted">Belum ada user staf. Silakan tambah baru.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
